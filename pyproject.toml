[project]
name = "weightlab"
version = "0.0.1.dev0"
description = "Local-first, CPU-only LLM checkpoint explorer: strict SafeTensors reader, change reports, local API."
readme = "README.md"
requires-python = ">=3.12"
# Exact pins; uv.lock records the full resolved set with hashes.
dependencies = [
    "numpy==2.5.4",
    # Local API (Phase 1): FastAPI + Pydantic schemas, served by uvicorn on loopback only.
    "fastapi==0.162.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    # Platform-native application data directory (doc 18 section 4).
    "platformdirs==4.14.5",
]

[project.scripts]
weightlab = "weightlab.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.14",
    "ruff==0.17.4",
    "mypy==2.4.1",
    # Upstream reference used only as an accept/reject oracle and by the fixture generator.
    "safetensors==0.8.0",
    # Contract validation of report fragments (Metric, LineageAssessment) in tests.
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    # In-process API test client (Starlette TestClient uses httpx2 from Starlette 1.x).
    "httpx2==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"
# Frozen specification tooling and docs (1.2-final) keep their own formatting; only new code is formatted.
extend-exclude = [
    "examples",
    "tests/fixtures/generated",
    "*.md",
    "scripts/build_documentation.py",
    "scripts/check_contracts.py",
    "scripts/check_demo_fixtures.py",
    "scripts/check_spec.py",
    "scripts/generate_demo_fixtures.py",
    "scripts/manifest.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S108", "S311", "S104"]  # S104: tests assert that non-loopback binds are refused
"scripts/**" = ["S603", "S607", "E501"]
"evaluation-kit/**" = ["S603"]
# Validation harness: runs weightlab/cp/ps as subprocesses, fetches pinned Hugging Face URLs (https only), wide tables.
"evidence/**" = ["S603", "S607", "S310", "S311", "E501"]  # runs the participant's own weightlab on the shipped fixtures
# Repository SQL: only constant column lists and WHERE fragments are interpolated; every value is a bound "?" parameter.
"weightlab/db/store.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["weightlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "perf: resource measurements on large sparse files (run by default; WEIGHTLAB_SKIP_PERF=1 skips)",
]
xfail_strict = true
