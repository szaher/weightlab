# Phase 0, 0.5 and 1 application CI: format, lint, typecheck and the full test suite on all three desktop OSes,
# then the G0 and G0.5 evidence reports per OS as build artifacts (doc 13 section 9, doc 14 Phases 0 and 0.5).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Install locked environment
        run: uv sync --locked --python 3.12
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck (every target platform, so platform branches are checked everywhere)
        run: |
          uv run mypy --platform linux
          uv run mypy --platform darwin
          uv run mypy --platform win32
      - name: Tests and G0 evidence (includes the 12 GiB sparse-file RSS benchmark)
        run: uv run python scripts/g0_evidence.py --out evidence/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-evidence-${{ matrix.os }}
          path: evidence/ci
      - name: G0.5 evidence (full suite again plus `weightlab diff` benchmark on 0.5-8 GiB sparse pairs)
        if: always()
        run: uv run python scripts/g05_evidence.py --out evidence/ci-g0.5 --sizes-gib 0.25,1,4 --work "${{ runner.temp }}/wl-diff-bench"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0.5-evidence-${{ matrix.os }}
          path: evidence/ci-g0.5
      - name: Phase 1 foundation evidence (database + local API, full suite)
        if: always()
        run: uv run python scripts/phase1_evidence.py --out evidence/ci-phase1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-evidence-${{ matrix.os }}
          path: evidence/ci-phase1
