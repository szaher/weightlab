# Temporary PR #15 maintenance job: build committed browser assets and refresh the source manifest.
# Remove this workflow after the generated artifacts have been committed.
name: refresh-compare-ui-pr15
on:
  push:
    branches: [feat/compare-dashboard]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and rebuild the committed UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Refresh source manifest
        run: python scripts/manifest.py --write
      - name: Commit generated UI and manifest to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- weightlab/ui/static MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh compare UI bundle and source manifest"
            git push origin HEAD:feat/compare-dashboard
          fi
